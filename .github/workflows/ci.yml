name: CI

# Only changes to the site (or this workflow) can change what these jobs check. Specs, the README
# and video/ don't. If main ever requires these checks, swap the filter for a skip job: a required
# check that never runs leaves the PR waiting.
on:
  push:
    branches: [main]
    paths:
      - "portfolio-website/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "portfolio-website/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node's install script downloads CUDA/TensorRT providers on Linux x64. The guide runs on
# the CPU binary bundled in the package, and that download timed out in npm ci (Phase 5, PR #5).
env:
  ONNXRUNTIME_NODE_INSTALL: skip

defaults:
  run:
    working-directory: portfolio-website

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: portfolio-website/.next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E and accessibility
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: portfolio-website/.next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: portfolio-website/playwright-report
          retention-days: 7

  # One job per page: 5 pages x 3 runs in a row took about 6.5 minutes, the longest part of CI.
  # Same pages, runs and budgets as lighthouserc.json; each job just keeps its own page.
  lighthouse:
    name: Lighthouse (phone, ${{ matrix.page.name }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page:
          - { name: home, path: / }
          - { name: validation-portal, path: /work/validation-portal }
          - { name: ridly, path: /work/ridly }
          - { name: guide, path: /guide }
          - { name: about, path: /about }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: portfolio-website/.next
      - name: Keep only this page in the Lighthouse config
        run: |
          jq --arg url "http://localhost:3200${{ matrix.page.path }}" '.ci.collect.url = [$url]' \
            lighthouserc.json > lighthouserc.page.json
          # Fail here, not later, if a page is added to one list but not the other.
          jq -e --arg url "http://localhost:3200${{ matrix.page.path }}" \
            'any(.ci.collect.url[]; . == $url)' lighthouserc.json
      - run: npm run lhci -- --config=lighthouserc.page.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ matrix.page.name }}
          path: portfolio-website/.lighthouseci
          include-hidden-files: true
          retention-days: 7
